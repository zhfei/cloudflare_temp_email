<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adsterra Native Banner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            background: transparent;
        }

        div[id^="container-"] {
            width: 100%;
        }
    </style>
</head>

<body>
    <script>
        (function () {
            // 获取父窗口域名，回退到当前域名
            var parentDomain = "";
            try {
                parentDomain = window.parent.location.hostname;
            } catch (e) {
                // 如果跨域限制无法获取 parent.location，则尝试从 referrer 获取
                if (document.referrer) {
                    var url = new URL(document.referrer);
                    parentDomain = url.hostname;
                }
            }

            // 广告配置映射
            var adsConfig = {
                'mail.bise.edu.kg': {
                    id: 'c7048b5a65c030a4b506b85a2c135b20',
                    url: 'https://pl28859164.effectivegatecpm.com/c7048b5a65c030a4b506b85a2c135b20/invoke.js'
                },
                'default': {
                    id: 'a1c9548452fc07cd7761086d0e555924',
                    url: 'https://pl28857670.effectivegatecpm.com/a1c9548452fc07cd7761086d0e555924/invoke.js'
                }
            };

            var config = adsConfig[parentDomain] || adsConfig['default'];

            // 创建容器
            var container = document.createElement('div');
            container.id = 'container-' + config.id;
            document.body.appendChild(container);

            // 加载脚本
            var s = document.createElement('script');
            s.async = true;
            s.setAttribute('data-cfasync', 'false');
            s.src = config.url;
            document.body.appendChild(s);
        })();
    </script>
</body>

</html>
